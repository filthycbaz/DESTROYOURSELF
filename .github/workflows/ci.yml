name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend — unitarias e integración
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Instalar dependencias
        working-directory: server
        run: npm ci
      - name: Tests con cobertura
        working-directory: server
        run: npm run test:coverage
      - name: Publicar reporte de cobertura y JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            server/coverage
            server/test-results
          retention-days: 14

  frontend-unit-tests:
    name: Frontend — unitarias de componentes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Instalar dependencias
        working-directory: client
        run: npm ci
      - name: Tests con cobertura
        working-directory: client
        run: npm run test:coverage
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-report
          path: client/coverage
          retention-days: 14

  frontend-build:
    name: Frontend — build de producción
    runs-on: ubuntu-latest
    needs: frontend-unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Instalar dependencias
        working-directory: client
        run: npm ci
      - name: Build
        working-directory: client
        run: npm run build

  e2e-tests:
    name: E2E — Cypress (Mongo efímero)
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: server
        run: npm ci

      - name: Instalar dependencias del frontend
        working-directory: client
        run: npm ci

      - name: Levantar API + Mongo efímero (background)
        working-directory: server
        run: nohup npm run e2e:server > e2e-server.log 2>&1 &

      - name: Esperar a que la API responda
        run: npx wait-on http://localhost:3001/api/products --timeout 60000

      - name: Levantar cliente y correr Cypress
        working-directory: client
        run: npm run test:e2e:ci
        env:
          CI: true

      - name: Log del backend efímero (si algo falló)
        if: failure()
        run: cat server/e2e-server.log

      - name: Subir videos y screenshots de Cypress (solo si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            client/cypress/videos
            client/cypress/screenshots
          retention-days: 7
